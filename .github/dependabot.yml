# Dependabot configuration (https://docs.github.com/code-security/dependabot)
version: 2
updates:
  # GitHub Actions: keeps the SHA pins in .github/workflows/ fresh. All action
  # references are SHA-pinned, so dependabot is the mechanism that rotates them
  # when upstream releases new versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Root dev/test dependencies (requirements-dev.txt: pytest, pip-audit).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Optional harness dependencies in service/scripts. NOTE: tokenizers is
  # capped at <=0.23.0 by transformers 5.15.x, so it must never be bumped
  # (the 0.23.1 release does not satisfy the cap). The other opt-in files are
  # pinned to current versions; any proposed bump must be re-validated on a
  # device before merging, because these backends are not exercised in CI.
  - package-ecosystem: "pip"
    directory: "/service/scripts"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "tokenizers"

  # Docker base images (service/Dockerfile*): tracks the digest-pinned
  # python:3.14-slim base. Monthly — digest churn is low-signal weekly.
  - package-ecosystem: "docker"
    directory: "/service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3